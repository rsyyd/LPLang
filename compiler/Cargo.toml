[package]
name = "lplang-compiler"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
description = "LPLang compiler frontend and codegen backends"
publish = false

[dependencies]
# Workspace deps
lalrpop = { workspace = true, features = ["lexer"] }
lalrpop-util = { workspace = true }
logos = { workspace = true }
ariadne = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
indexmap = { workspace = true }
smallvec = { workspace = true }
bitflags = { workspace = true }
once_cell = { workspace = true }
cranelift = { workspace = true, optional = true }
cranelift-module = { workspace = true, optional = true }
cranelift-object = { workspace = true, optional = true }
# wasm-encoder = { workspace = true, optional = true }
# swc = { workspace = true, optional = true }
# swc_common = { workspace = true, optional = true }
# swc_ecma_parser = { workspace = true, optional = true }
# swc_ecma_codegen = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Internal deps
# lplang-versioning = { path = "../versioning" }  # disabled for Phase 0-1

[build-dependencies]
lalrpop = { workspace = true }

[features]
default = ["cranelift"]
cranelift = ["dep:cranelift", "dep:cranelift-module", "dep:cranelift-object"]
# wasm = ["dep:wasm-encoder"]
# js = ["dep:swc", "dep:swc_ecma_parser", "dep:swc_ecma_codegen", "dep:swc_common"]