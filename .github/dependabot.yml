# Dependabot Configuration

version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "cargo"
    groups:
      rust-toolchain:
        patterns:
          - "rust-toolchain*"
      clippy:
        patterns:
          - "clippy*"
      fmt:
        patterns:
          - "rustfmt*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"