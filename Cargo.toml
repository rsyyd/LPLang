[workspace]
resolver = "2"
members = [
    "compiler",
    "vm",
    "stdlib",
    "fmt",
    # "lpm",       # disabled for Phase 0-1 (deps require Rust 1.88+)
    # "lsp",       # disabled for Phase 0-1 (deps require Rust 1.88+)
    # "versioning", # disabled for Phase 0-1 (deps require Rust 1.88+)
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/rsyyd/LPLang"
authors = ["rsyyd <rsyyd@users.noreply.github.com>"]
description = "LPLang — Familiar syntax, modern semantics"

[workspace.dependencies]
# Parser & AST
logos = "0.16"

# Diagnostics & Error Handling
ariadne = "0.4"
thiserror = "1.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
toml_edit = "0.22"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"

# Async & Concurrency
tokio = { version = "1.38", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Collections & Utilities
indexmap = "2.0"
hashbrown = "0.14"
smallvec = "1.11"
bitflags = "2.5"
once_cell = "1.18"
crossbeam-channel = "0.5"
parking_lot = "0.12"
chrono = "0.4"
walkdir = "2.5"

# Testing
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.9"
assert_fs = "1.0"
pretty_assertions = "1.4"

# Versioning & Git
git2 = "0.18"
semver = "1.0"
url = "2.4"  # older version without ICU deps
# conventional-commit = "0.2"  # not on crates.io at 0.2

# Codegen Backends
cranelift = { version = "0.109", features = ["default"] }
cranelift-module = "0.109"
cranelift-object = "0.109"
# wasm-encoder = "0.259"  # requires Rust 1.88+, enable in Phase 3
# swc ecosystem - using compatible versions (JS backend in Phase 3)
# swc = { version = "79", features = ["ecma", "visit"] }
# swc_common = "79"
# swc_ecma_parser = { version = "79", features = ["typescript"] }
# swc_ecma_codegen = "79"

# LSP
tower-lsp = "0.20"
tower = "0.4"
lsp-types = "0.94"

# FFI & System
libc = "0.2"
cc = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "unpacked"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"
debug = true

[build-profile.dev]
opt-level = 1

[build-profile.release]
opt-level = 3
lto = true